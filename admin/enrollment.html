<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Enrollment Management | Digitech College</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: "class" };
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/custom.css" />
</head>

<body class="min-h-screen bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">
    <aside id="side"
        class="sidebar fixed inset-y-0 left-0 z-40 w-64 -translate-x-full lg:translate-x-0 bg-white dark:bg-slate-900 border-r dark:border-slate-800">
        <div class="h-full flex flex-col">
            <div class="h-20 border-b dark:border-slate-800 flex items-center gap-3 px-5">
                <img src="../assets/images/16432.png" class="w-10 h-10 rounded-xl flex items-center justify-center"
                    alt="logo" />
                <div class="font-extrabold tracking-tight">DIGITECH</div>
                 <div class="block text-[10px] tracking-[.22em] text-slate-400">COLLEGE PORTAL</div>
            </div>
            <nav class="p-3 space-y-1 flex-1">
                <a href="dashboard.html"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                    <i data-lucide="layout-dashboard" class="w-4"></i>
                    Dashboard
                </a>
                <a href="users.html"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                    <i data-lucide="users-round" class="w-4"></i>
                    Users
                </a>
                <a href="enrollment.html"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium nav-active">
                    <i data-lucide="clipboard-list" class="w-4"></i>
                    Enrollment
                </a>
                <a href="documents.html"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                    <i data-lucide="file-text" class="w-4"></i>
                    Documents
                </a>
                <a href="grades.html"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                    <i data-lucide="chart-no-axes-combined" class="w-4"></i>
                    Grades
                </a>
                <a href="competencies.html"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                    <i data-lucide="award" class="w-4"></i>
                    Competencies
                </a>
                <a href="settings.html"
                    class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                    <i data-lucide="settings" class="w-4"></i>
                    Settings
                </a>
                <button onclick="APP.showNotifications()"
                    class="w-full flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300">
                    <i data-lucide="bell" class="w-4"></i>
                    Notifications
                    <span id="count" class="ml-auto rounded-full bg-red-500 text-white text-[10px] px-2 py-0.5">0</span>
                </button>
            </nav>
            <button onclick="AUTH.logout()"
                class="m-3 flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-red-600 hover:bg-red-50">
                <i data-lucide="log-out" class="w-4"></i>
                Log out
            </button>
        </div>
    </aside>
    <div class="lg:pl-64">
        <header
            class="sticky top-0 z-30 h-16 border-b bg-white/90 dark:bg-slate-950/90 dark:border-slate-800 backdrop-blur flex items-center justify-between px-4 sm:px-6">
            <div class="flex items-center gap-3">
                <button id="open" class="lg:hidden p-2">
                    <i data-lucide="menu"></i>
                </button>
                <div>
                    <small class="text-xs text-slate-400">Admin Portal</small>
                    <h1 class="font-bold">Enrollment Management</h1>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="APP.toggleTheme()" class="p-2.5 rounded-xl border dark:border-slate-700">
                    <i data-lucide="moon" data-theme-icon class="w-4"></i>
                </button>
                <button onclick="APP.showNotifications()" class="p-2.5 rounded-xl border dark:border-slate-700">
                    <i data-lucide="bell" class="w-4"></i>
                </button>
                <img id="avatar" data-profile-photo class="w-9 h-9 rounded-full object-cover border-2 border-green-100"
                    alt="Profile" />
            </div>
        </header>
        <main class="p-4 sm:p-6 lg:p-8">
            <div class="max-w-7xl mx-auto">
                <div class="mb-7">
                    <p class="text-sm text-purple-600 font-semibold">Enrollment</p>
                    <h2 class="text-3xl font-bold">Enrollment Records</h2>
                </div>
                <div class="card overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-sm">
                            <thead class="bg-slate-50 dark:bg-slate-800">
                                <tr>
                                    <th class="p-4 text-left">Record</th>
                                    <th class="p-4 text-left">Student</th>
                                    <th class="p-4 text-left">Program</th>
                                    <th class="p-4 text-left">Status</th>
                                    <th class="p-4"></th>
                                </tr>
                            </thead>
                            <tbody id="rows"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <div id="modalRoot"></div>
    <script src="../js/storage.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/app.js"></script>
    <script>
        const U = AUTH.requireRole("admin");
        if (U) {
            avatar.src = getProfilePhoto(U);
            APP.applyTheme();
            lucide.createIcons();
            document.getElementById("open").onclick = () =>
                side.classList.toggle("-translate-x-full");
            APP.updateNotif();
        }
        let a = DG.getData("enrollments", []);
        rows.innerHTML = a
            .map(
                (e) =>
                    `<tr class="border-t dark:border-slate-800">
                <td class="p-4 font-mono text-xs">${e.id}</td>
                <td class="p-4">${e.studentId}</td>
                <td class="p-4">${APP.esc(e.strand || e.programType)}</td>
                <td class="p-4">
                    <select id="s-${e.id}" class="input rounded-lg border px-2 py-1.5">
                        <option>Draft</option>
                        <option>Submitted</option>
                        <option>Under Review</option>
                        <option>Approved</option>
                        <option>Rejected</option>
                        <option>Enrolled</option>
                    </select>
                </td>
                <td class="p-4">
                    <button onclick="save('${e.id}')" class="text-green-700 font-semibold">Update</button>
                </td>
            </tr>`,
            )
            .join("");
        a.forEach((e) => (document.getElementById("s-" + e.id).value = e.status));
        function save(id) {
            let a = DG.getData("enrollments", []),
                e = a.find((x) => x.id === id);
            e.status = document.getElementById("s-" + id).value;
            DG.saveData("enrollments", a);
            APP.toast("Enrollment status updated");
        }
    </script>
</body>

</html>
