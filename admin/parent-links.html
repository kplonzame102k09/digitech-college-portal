<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Parent Link Requests | Digitech College</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: "class" };</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/custom.css" />
</head>

<body class="min-h-screen bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">
  <div id="global-sidebar"></div>
  <div class="lg:pl-64">
    <header
      class="sticky top-0 z-30 flex h-16 items-center justify-between border-b bg-white/90 px-4 backdrop-blur dark:border-slate-800 dark:bg-slate-950/90 sm:px-6">
      <div class="flex items-center gap-3"><button id="open" class="p-2 lg:hidden"><i data-lucide="menu"></i></button>
        <div><small class="text-xs text-slate-400">Admin Portal</small>
          <h1 class="font-bold">Parent link requests</h1>
        </div>
      </div>
      <div class="flex items-center gap-2"><button onclick="APP.toggleTheme()"
          class="rounded-xl border p-2.5 dark:border-slate-700"><i data-lucide="moon" data-theme-icon
            class="w-4"></i></button><button onclick="APP.showNotifications()"
          class="rounded-xl border p-2.5 dark:border-slate-700"><i data-lucide="bell" class="w-4"></i></button><img
          id="avatar" data-profile-photo class="h-9 w-9 rounded-full object-cover" alt="Profile" /></div>
    </header>
    <main class="p-4 sm:p-6 lg:p-8">
      <div class="mx-auto max-w-7xl">
        <section class="mb-7">
          <p class="text-xs font-bold uppercase tracking-[0.18em] text-blue-600">Registrar workspace</p>
          <div class="mt-2 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
            <div>
              <h2 class="text-3xl font-extrabold tracking-tight">Parent link requests</h2>
              <p class="mt-2 max-w-2xl text-slate-500">Verify parent–student relationships before records are shared.
              </p>
            </div><span class="teacher-page-chip"><i data-lucide="shield-check" class="h-4 w-4"></i>Review
              required</span>
          </div>
        </section>
        <section class="card overflow-hidden">
          <div class="border-b border-slate-200 px-5 py-4 dark:border-slate-800">
            <h3 class="font-extrabold">Verification queue</h3>
            <p class="text-xs text-slate-400">Approve only relationships supported by registrar records.</p>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm">
              <thead class="bg-slate-50 dark:bg-slate-800">
                <tr>
                  <th class="p-4">Parent</th>
                  <th class="p-4">Student</th>
                  <th class="p-4">Submitted</th>
                  <th class="p-4">Status</th>
                  <th class="p-4">Actions</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </section>
      </div>
    </main>
  </div>
  <div id="modalRoot"></div>
  <script src="./components/sidebar.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/features.js"></script>
  <script>
    const admin = AUTH.requireRole("admin");
    if (admin) { avatar.src = getProfilePhoto(admin); APP.applyTheme(); APP.updateNotif(); open.onclick = () => side.classList.toggle("-translate-x-full"); lucide.createIcons(); const users = DG.getData("users", []); const name = (u) => `${u?.firstName || ""} ${u?.lastName || ""}`.trim() || u?.id || "Unknown"; const render = () => { const reqs = DG.getData("parentLinkRequests", []); rows.innerHTML = reqs.length ? reqs.map((r) => { const p = users.find((u) => u.id === r.parentId), s = users.find((u) => u.id === r.studentId); return `<tr class="teacher-table-row border-t border-slate-100 dark:border-slate-800"><td class="p-4">${APP.esc(name(p))}<small class="block text-xs text-slate-400">${APP.esc(r.parentId)}</small></td><td class="p-4">${APP.esc(name(s))}<small class="block text-xs text-slate-400">${APP.esc(r.studentId)}</small></td><td class="p-4">${APP.esc(APP.formatDate(r.createdAt))}</td><td class="p-4">${APP.statusBadge(r.status)}</td><td class="p-4">${r.status === "Pending" ? `<button data-approve="${APP.esc(r.id)}" class="mr-2 font-semibold text-emerald-700">Approve</button><button data-reject="${APP.esc(r.id)}" class="font-semibold text-rose-700">Reject</button>` : "—"}</td></tr>`; }).join("") : '<tr><td colspan="5"><div class="teacher-empty-state m-4"><i data-lucide="inbox"></i><b>No link requests</b><p>New parent verification requests will appear here.</p></div></td></tr>'; rows.querySelectorAll("button").forEach((button) => button.onclick = () => { const all = DG.getData("parentLinkRequests", []), r = all.find((x) => x.id === (button.dataset.approve || button.dataset.reject)); if (!r) return; r.status = button.dataset.approve ? "Approved" : "Rejected"; r.reviewedBy = admin.id; r.reviewedAt = new Date().toISOString(); if (r.status === "Approved") { const p = users.find((u) => u.id === r.parentId), s = users.find((u) => u.id === r.studentId); if (p) { p.childId = r.studentId; p.childIds = [...(p.childIds || []), r.studentId].filter((v, i, a) => a.indexOf(v) === i); p.children = p.childIds; DG.saveData("users", users); } FEATURES.notify([r.studentId], "Parent link approved", `Your parent link request was approved. ${p ? FEATURES.userName(p) : "Your parent"} can now view your shared records.`, "parent-link"); if (p) FEATURES.notify([p.id], "Parent link approved", `${s ? FEATURES.userName(s) : "Your student"} is now connected to your parent portal.`, "parent-link"); } DG.saveData("parentLinkRequests", all); APP.toast(`Request ${r.status.toLowerCase()}`); render(); lucide.createIcons(); }); lucide.createIcons(); }; render(); }
  </script>
</body>

</html>
