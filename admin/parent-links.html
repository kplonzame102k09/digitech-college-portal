<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parent Link Requests | Digitech College</title><script src="https://cdn.tailwindcss.com"></script><script src="../js/storage.js"></script><script src="../js/data.js"></script><script src="../js/auth.js"></script><script src="../js/app.js"></script></head><body class="min-h-screen bg-slate-100 text-slate-800"><main class="mx-auto max-w-6xl p-5 sm:p-8"><header class="mb-6 flex items-start justify-between"><div><p class="text-xs font-bold uppercase tracking-[.18em] text-emerald-600">Registrar workspace</p><h1 class="text-3xl font-extrabold">Parent link requests</h1><p class="mt-2 text-sm text-slate-500">Verify parent–student relationships before records are shared.</p></div><a href="dashboard.html" class="rounded-xl border bg-white px-4 py-2 text-sm font-semibold">Dashboard</a></header><section class="rounded-2xl border bg-white p-5 shadow-sm"><div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead class="bg-slate-50"><tr><th class="p-3">Parent</th><th class="p-3">Student</th><th class="p-3">Submitted</th><th class="p-3">Status</th><th class="p-3">Actions</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
const admin=AUTH.requireRole("admin");
if(admin){const rows=document.getElementById("rows"); const users=DG.getData("users",[]); const name=(u)=>`${u?.firstName||""} ${u?.lastName||""}`.trim()||u?.id||"Unknown"; function render(){const reqs=DG.getData("parentLinkRequests",[]); rows.innerHTML=reqs.length?reqs.map(r=>{const p=users.find(u=>u.id===r.parentId),s=users.find(u=>u.id===r.studentId);return `<tr class="border-t"><td class="p-3">${APP.esc(name(p))}<small class="block text-xs text-slate-400">${APP.esc(r.parentId)}</small></td><td class="p-3">${APP.esc(name(s))}<small class="block text-xs text-slate-400">${APP.esc(r.studentId)}</small></td><td class="p-3">${APP.esc(APP.formatDate(r.createdAt))}</td><td class="p-3">${APP.esc(r.status)}</td><td class="p-3">${r.status==="Pending"?`<button data-approve="${APP.esc(r.id)}" class="mr-2 font-semibold text-emerald-700">Approve</button><button data-reject="${APP.esc(r.id)}" class="font-semibold text-rose-700">Reject</button>`:"—"}</td></tr>`}).join(""):`<tr><td colspan="5" class="p-8 text-center text-slate-500">No link requests.</td></tr>`; rows.querySelectorAll("button").forEach(b=>b.onclick=()=>{const all=DG.getData("parentLinkRequests",[]),r=all.find(x=>x.id===b.dataset.approve||x.id===b.dataset.reject);if(!r)return;r.status=b.dataset.approve?"Approved":"Rejected";r.reviewedBy=admin.id;r.reviewedAt=new Date().toISOString();if(r.status==="Approved"){const p=users.find(u=>u.id===r.parentId);p.childId=r.studentId;p.childIds=[...(p.childIds||[]),r.studentId].filter((v,i,a)=>a.indexOf(v)===i);p.children=p.childIds;DG.saveData("users",users);}DG.saveData("parentLinkRequests",all);APP.toast(`Request ${r.status.toLowerCase()}`);render()})} render();lucide?.createIcons?.()}
</script></body></html>
