<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Side Bar </title>
    <!-- <link rel="stylesheet" href="../css/custom.css"> -->
</head>
<body>
    <aside id="side"
    class="sidebar fixed inset-y-0 left-0 z-40 w-64 -translate-x-full border-r border-slate-200 bg-white lg:translate-x-0 dark:border-slate-800 dark:bg-slate-900">

    <div class="flex h-full flex-col">

        <!-- LOGO -->
        <div class="flex h-20 items-center gap-3 border-b border-slate-200 px-5 dark:border-slate-800">

            <img src="../assets/images/16432.png"
                class="h-10 w-10 rounded-xl object-cover"
                alt="Digitech College logo" />

            <div>
                <div class="font-extrabold tracking-tight">
                    DIGITECH
                </div>

                <div class="text-[10px] font-semibold tracking-[.22em] text-slate-400">
                    COLLEGE PORTAL
                </div>
            </div>

        </div>


        <!-- NAVIGATION -->
        <nav class="flex-1 space-y-1 overflow-y-auto p-3">

            <a href="dashboard.html"
                class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium nav-active">
                <i data-lucide="layout-dashboard" class="w-4"></i>
                Dashboard
            </a>

            <a href="users.html"
                class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                <i data-lucide="users" class="w-4"></i>
                Users
            </a>

            <a href="enrollment.html"
                class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                <i data-lucide="clipboard-list" class="w-4"></i>
                Enrollment
            </a>

            <a href="documents.html"
                class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                <i data-lucide="file-text" class="w-4"></i>
                Documents
            </a>

            <a href="grades.html"
                class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                <i data-lucide="chart-no-axes-combined" class="w-4"></i>
                Grades
            </a>

            <a href="competencies.html"
                class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                <i data-lucide="award" class="w-4"></i>
                Competencies
            </a>

            <a href="attendance.html"
                class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                <i data-lucide="calendar-check-2" class="w-4"></i>
                Attendance
            </a>

            <a href="requirements.html"
                class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                <i data-lucide="folder-check" class="w-4"></i>
                Requirements
            </a>

            <a href="announcements.html"
                class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                <i data-lucide="megaphone" class="w-4"></i>
                Announcements
            </a>

            <a href="parent-links.html"
                class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                <i data-lucide="users-round" class="w-4"></i>
                Parent links
            </a>

            <a href="settings.html"
                class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800">
                <i data-lucide="settings" class="w-4"></i>
                Settings
            </a>

            <button onclick="APP.showNotifications()"
                class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm text-slate-600 hover:bg-slate-100 dark:text-slate-300">

                <i data-lucide="bell" class="w-4"></i>

                Notifications

                <span id="count"
                    class="ml-auto rounded-full bg-red-500 px-2 py-0.5 text-[10px] text-white">
                    0
                </span>

            </button>

        </nav>


        <!-- LOGOUT -->
        <button type="button"
            data-logout
            class="m-3 flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-red-600 hover:bg-red-50">

            <i data-lucide="log-out" class="h-4 w-4"></i>

            Log out

        </button>

    </div>

</aside>
    <!-- <script src="../js/app.js"></script> -->
</body>
</html>
