<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Announcements | Digitech College</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/custom.css">
</head>

<body data-parent-page="announcements"
  class="min-h-screen bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">
  <aside id="sidebar"
    class="sidebar fixed inset-y-0 left-0 z-40 w-64 -translate-x-full border-r border-slate-200 bg-white lg:translate-x-0 dark:border-slate-800 dark:bg-slate-900">
    <div class="flex h-full flex-col">
      <div class="flex h-20 items-center gap-3 border-b border-slate-200 px-5 dark:border-slate-800">
        <img src="../assets/images/16432.png" class="h-10 w-10 rounded-xl object-cover" alt="Digitech College logo">
        <div>
          <div class="font-extrabold tracking-tight">DIGITECH</div>
          <div class="text-[10px] font-semibold tracking-[.22em] text-slate-400">COLLEGE PORTAL</div>
        </div>
      </div>
      <nav class="flex-1 space-y-1 overflow-y-auto p-3"><a data-nav-page="dashboard" href="dashboard.html"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium"><i data-lucide="layout-dashboard"
            class="h-4 w-4"></i>Dashboard</a><a data-nav-page="children" href="children.html"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium"><i data-lucide="users-round"
            class="h-4 w-4"></i>My Children</a><a data-nav-page="attendance" href="attendance.html"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium"><i data-lucide="calendar-check"
            class="h-4 w-4"></i>Attendance</a><a data-nav-page="grades" href="grades.html"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium"><i
            data-lucide="chart-no-axes-combined" class="h-4 w-4"></i>Grades</a><a data-nav-page="documents"
          href="documents.html" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium"><i
            data-lucide="file-text" class="h-4 w-4"></i>Documents</a><a data-nav-page="announcements"
          href="announcements.html" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium"><i
            data-lucide="megaphone" class="h-4 w-4"></i>Announcements</a><a data-nav-page="profile" href="profile.html"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium"><i data-lucide="user-round"
            class="h-4 w-4"></i>Profile</a><button type="button" data-notifications
          class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 dark:text-slate-300 dark:hover:bg-slate-800"><i
            data-lucide="bell" class="h-4 w-4"></i>Notifications<span id="notifCount"
            class="ml-auto rounded-full bg-red-500 px-2 py-0.5 text-[10px] text-white">0</span></button></nav>
      <div class="border-t border-slate-200 p-3 dark:border-slate-800"><button type="button" data-logout
          class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-red-600 hover:bg-red-50"><i
            data-lucide="log-out" class="h-4 w-4"></i>Log out</button></div>
    </div>
  </aside>
  <div class="lg:pl-64">
    <header
      class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-950/90">
      <div class="flex h-16 items-center justify-between px-4 sm:px-6">
        <div class="flex items-center gap-3"><button type="button" data-menu-toggle class="rounded-lg p-2"><i
              data-lucide="menu" class="h-5 w-5"></i></button>
          <div>
            <p class="text-xs text-slate-400">Parent Portal</p>
            <h1 class="font-bold">Announcements</h1>
          </div>
        </div>
        <div class="flex items-center gap-2"><button type="button" data-theme-toggle
            class="rounded-xl border border-slate-200 p-2.5"><i data-theme-icon data-lucide="moon"
              class="h-4 w-4"></i></button><button type="button" data-notifications
            class="relative rounded-xl border border-slate-200 p-2.5"><i data-lucide="bell" class="h-4 w-4"></i><span
              id="topNotif"
              class="absolute -right-1 -top-1 hidden h-4 min-w-4 rounded-full bg-red-500 px-1 text-[9px] font-bold text-white"></span></button>
          <img data-profile-photo src="../assets/images/16432.png" class="ml-1 h-9 w-9 rounded-full object-cover border-2 border-green-100" alt="Parent profile photo">
          <div class="hidden sm:block">
            <div class="text-sm font-semibold" data-parent-full-name></div>
            <div class="text-[11px] text-slate-400" data-parent-id></div>
          </div>
        </div>
      </div>
    </header>
    <main class="p-4 sm:p-6 lg:p-8">
      <div class="mx-auto max-w-7xl">
        <section class="mb-7">
          <p class="text-sm font-semibold text-green-600">College news</p>
          <h2 class="mt-1 text-3xl font-bold tracking-tight">Announcements</h2>
          <p class="mt-2 text-slate-500 dark:text-slate-400">Important updates and notices relevant to your family.</p>
        </section>
        <div id="announcementList" class="space-y-4"></div>
        <div id="announcementsEmpty"
          class="hidden rounded-2xl border border-dashed border-slate-300 px-6 py-12 text-center dark:border-slate-700">
          <h3 class="mt-4 font-semibold">No announcements yet</h3>
          <p class="mx-auto mt-1 max-w-md text-sm text-slate-500 dark:text-slate-400">New college announcements will
            appear here when they are published.</p>
        </div>
      </div>
    </main>
  </div>
  <div id="modalRoot"></div>
  <template id="announcementTemplate">
    <article class="card p-5">
      <div class="flex items-start gap-4"><span
          class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-green-50 text-green-600 dark:bg-green-950"><i
            data-lucide="megaphone" class="h-5 w-5"></i></span>
        <div class="min-w-0 flex-1">
          <div class="flex flex-col gap-1 sm:flex-row sm:items-start sm:justify-between">
            <h3 data-announcement-title class="font-bold"></h3><time data-announcement-date
              class="text-xs text-slate-400"></time>
          </div>
          <p data-announcement-message class="mt-2 text-sm leading-6 text-slate-600 dark:text-slate-300"></p><span
            data-announcement-category
            class="mt-3 inline-flex rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600 dark:bg-slate-800 dark:text-slate-300"></span>
        </div>
      </div>
    </article>
  </template>
  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="parent.js"></script>
  <script>PARENT.init();</script>
</body>

</html>
