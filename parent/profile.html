<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>My Profile | Digitech College</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: "class" };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="../css/custom.css" />
</head>

<body data-parent-page="profile" class="min-h-screen bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">
<div id="global-sidebar"></div>
  <div class="lg:pl-64">
    <header
      class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur dark:border-slate-800 dark:bg-slate-950/90">
      <div class="flex h-16 items-center justify-between px-4 sm:px-6">
        <div class="flex items-center gap-3">
           <button id="open" class="lg:hidden p-2">
                    <i data-lucide="menu"></i>
                </button>
          <div>
            <p class="text-xs text-slate-400">Parent Portal</p>
            <h1 class="font-bold">My Profile</h1>
          </div>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" data-theme-toggle class="rounded-xl border border-slate-200 p-2.5 dark:border-slate-700">
            <i data-theme-icon data-lucide="moon" class="h-4 w-4"></i></button><button type="button" data-notifications
            class="relative rounded-xl border border-slate-200 p-2.5 dark:border-slate-700">
            <i data-lucide="bell" class="h-4 w-4"></i>
            <span id="topNotif" class="fixed hidden w-4 rounded-full bg-red-500 px-1 text-[9px] font-bold text-white"></span>
          </button>
          <img data-profile-photo src="../assets/images/16432.png"
            class="ml-1 h-9 w-9 rounded-full object-cover border-green-100" alt="Parent profile photo" />
          <div class="hidden sm:block">
            <div class="text-sm font-semibold" data-parent-full-name></div>
            <div class="text-[11px] text-slate-400" data-parent-id></div>
          </div>
        </div>
      </div>
    </header>
    <main class="p-4 sm:p-6 lg:p-8">
      <div class="mx-auto max-w-7xl">
        <section class="mb-7">
          <p class="text-sm font-semibold text-green-600">Account settings</p>
          <h2 class="mt-1 text-3xl font-bold tracking-tight">My Profile</h2>
          <p class="mt-2 text-white">
            Keep your parent contact details current for school
            communications.
          </p>
        </section>
        <section class="card p-6">
          <div
            class="flex flex-col gap-4 border-b border-slate-200 pb-6 sm:flex-row sm:items-center dark:border-slate-800">
            <img id="profilePhoto" data-profile-photo src="../assets/images/16432.png"
              class="h-16 w-16 rounded-2xl object-cover" alt="Parent profile photo" />
            <div>
              <h3 id="profileName" class="text-xl font-bold"></h3>
              <p id="profileId" class="mt-1 font-mono text-sm text-green-700 dark:text-green-300"></p>
              <p id="profileRelationship" class="mt-1 text-sm text-slate-500"></p>
            </div>
          </div>
          <form id="profileForm" class="mt-6 grid gap-4 md:grid-cols-2">
            <label class="text-sm font-medium">Email address<input id="profileEmail" readonly
                class="input mt-1.5 w-full rounded-xl border bg-slate-50 px-3 py-2.5 dark:bg-slate-800" /></label><label
              class="text-sm font-medium">Contact number<input id="profileContact"
                class="input mt-1.5 w-full rounded-xl border px-3 py-2.5" /></label><label
              class="text-sm font-medium">Occupation<input id="profileOccupation"
                class="input mt-1.5 w-full rounded-xl border px-3 py-2.5" /></label><label
              class="text-sm font-medium">Emergency contact<input id="profileEmergencyContact"
                class="input mt-1.5 w-full rounded-xl border px-3 py-2.5" /></label><label
              class="text-sm font-medium md:col-span-2">Address<textarea id="profileAddress" rows="3"
                class="input mt-1.5 w-full rounded-xl border px-3 py-2.5"></textarea>
            </label>
            <div class="flex flex-wrap items-center gap-3 md:col-span-2">
              <button type="submit"
                class="rounded-xl bg-green-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-green-700">
                Save changes</button><span class="text-xs text-slate-400">Your parent ID and linked child records are
                managed by the
                registrar.</span>
            </div>
          </form>
        </section>
      </div>
    </main>
  </div>
  <div id="modalRoot"></div>
  <script src="./components/sidebar.js"></script>
  <script src="../js/storage.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>
  <script src="parent.js"></script>
  <script>
    PARENT.init();
  </script>
</body>

</html>
