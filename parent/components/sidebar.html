<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
      <aside id="sidebar"

    <div class="flex h-full flex-col">
      <div class="flex h-20 items-center gap-3 border-b border-slate-200 px-5 dark:border-slate-800">
        <img src="../assets/images/16432.png" class="h-10 w-10 rounded-xl object-cover" alt="Digitech College logo" />
        <div>
          <div class="font-extrabold tracking-tight">DIGITECH</div>
          <div class="text-[10px] font-semibold tracking-[.22em] text-slate-400">
            COLLEGE PORTAL
          </div>
        </div>
      </div>
      <nav class="flex-1 space-y-1 overflow-y-auto p-3"><a data-nav-page="dashboard" href="dashboard.html"

            data-lucide="layout-dashboard" class="w-4"></i>Dashboard</a><a data-nav-page="children" href="children.html"

            data-lucide="users-round" class="w-4"></i>My Children</a><a data-nav-page="attendance"
          href="attendance.html"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"><i
            data-lucide="calendar-check-2" class="w-4"></i>Attendance</a><a data-nav-page="grades" href="grades.html"
          class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800"><i
            data-lucide="chart-no-axes-combined" class="w-4"></i>Grades</a><a data-nav-page="documents"
          href="documents.html"

            data-lucide="file-text" class="w-4"></i>Documents</a><a data-nav-page="announcements"

        <button type="button" data-logout
          class="flex w-full items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-red-600 hover:bg-red-50">
          <i data-lucide="log-out" class="h-4 w-4"></i>Log out
