<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Attendance Management | Digitech College</title><script src="https://cdn.tailwindcss.com"></script><script src="https://unpkg.com/lucide@latest"></script><link rel="stylesheet" href="../css/custom.css"></head><body data-role="teacher" data-feature="attendance" class="min-h-screen bg-slate-100 text-slate-800"><header class="border-b bg-white px-5 py-4"><div class="mx-auto flex max-w-7xl items-center justify-between"><div><p class="text-xs font-bold uppercase tracking-[.18em] text-emerald-600">Digitech College</p><h1 class="text-2xl font-extrabold">Attendance Management</h1><p class="text-sm text-slate-500">Record attendance for learners assigned to you.</p></div><div class="flex gap-2"><a href="dashboard.html" class="rounded-xl border px-3 py-2 text-sm font-semibold">Dashboard</a><button id="logout" class="rounded-xl bg-slate-900 px-3 py-2 text-sm font-semibold text-white">Log out</button></div></div></header><main class="mx-auto max-w-7xl space-y-6 p-5 sm:p-8"><section class="rounded-2xl border bg-white p-5 shadow-sm"><div class="mb-4 flex items-center justify-between"><div><h2 class="text-lg font-extrabold">Record attendance</h2><p class="text-sm text-slate-500">Create or correct attendance records for the selected learner.</p></div><button id="newAttendance" class="rounded-xl bg-emerald-600 px-4 py-2 text-sm font-semibold text-white">New record</button></div><div id="attendanceDialog" class="hidden rounded-xl bg-slate-50 p-4"><form id="attendanceForm" class="grid gap-3 md:grid-cols-6"><input id="recordId" type="hidden"><select id="student" class="rounded-xl border px-3 py-2 md:col-span-2" required></select><input id="date" type="date" class="rounded-xl border px-3 py-2" required><input id="subject" class="rounded-xl border px-3 py-2" placeholder="Subject/session" required><select id="status" class="rounded-xl border px-3 py-2"><option>Present</option><option>Late</option><option>Absent</option></select><input id="remarks" class="rounded-xl border px-3 py-2" placeholder="Remarks"><div class="md:col-span-6 flex justify-end gap-2"><button type="button" id="closeAttendance" class="rounded-xl border px-4 py-2">Cancel</button><button class="rounded-xl bg-emerald-600 px-4 py-2 font-semibold text-white">Save attendance</button></div></form></div></section><section class="rounded-2xl border bg-white p-5 shadow-sm"><div class="mb-4 flex justify-end"><button id="export" class="rounded-xl border px-4 py-2 text-sm font-semibold">Export CSV</button></div><div class="overflow-x-auto"><table class="w-full text-left text-sm"><thead class="bg-slate-50"><tr><th class="p-3">Student</th><th class="p-3">Date</th><th class="p-3">Subject/session</th><th class="p-3">Status</th><th class="p-3">Remarks</th><th class="p-3">Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div id="modalRoot"></div><script src="../js/storage.js"></script><script src="../js/data.js"></script><script src="../js/auth.js"></script><script src="../js/app.js"></script><script src="../js/feature-ui.js"></script><script src="../js/features.js"></script><script src="../js/workflows.js"></script><script>const sel=document.querySelector("#student"); if(sel && document.body.dataset.role==="teacher"){sel.innerHTML=FEATURES.teacherStudents(AUTH.requireRole("teacher")).map(s=>`<option value="${APP.esc(s.id)}">${APP.esc(FEATURES.userName(s))}</option>`).join("");} if(sel && document.body.dataset.role==="admin"){sel.innerHTML=FEATURES.students().map(s=>`<option value="${APP.esc(s.id)}">${APP.esc(FEATURES.userName(s))}</option>`).join("");} lucide.createIcons();</script></body></html>
